# ~/.tmux.agents.conf — workmux key bindings (loaded by tmux.conf via `source-file -q`).
# Prefix is Ctrl+a. Keys avoid clashes with this setup (resurrect uses C-s, resize uses H J K L).

bind D display-popup -h 80% -w 90% -E "workmux dashboard"                    # all agents: status, diff, send input
bind C-w display-popup -h 80% -w 90% -E "workmux dashboard --tab worktrees"  # worktrees tab
bind T run-shell "workmux sidebar"                                           # toggle the status sidebar
bind u run-shell "workmux last-done"                                         # jump to the agent that just finished / waits (repeat to cycle)
bind A run-shell "workmux last-agent"                                        # toggle between the last two agents

# New task: type a branch name (e.g. fix-login); runs in the current pane's repo
bind N command-prompt -p "new task (branch):" "display-popup -E -d '#{pane_current_path}' \"workmux add '%%'\""
# New task from a prompt: opens $EDITOR, auto-names the branch, starts Pi with the prompt
bind O display-popup -w 90% -h 80% -E -d "#{pane_current_path}" "workmux add -A -e"
