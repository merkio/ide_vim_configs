# ~/.tmux.conf — tmux 2.2+ (проверено на 3.4/3.5/3.6)
# Мышь, vim-совместимые клавиши, копирование в системный буфер, плагины.
# Префикс: Ctrl+a  (Ctrl+a, затем a — отправить Ctrl+a в программу)

# ───────────── Основное ─────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # truecolor
set -g mouse on                           # мышь: клик, перетаскивание границ, колесо, выделение
set -g history-limit 50000
set -g escape-time 10                     # без лага Esc в vim
set -g focus-events on                    # vim autoread / gitgutter
set -g base-index 1                       # окна с 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on                   # OSC52: копирование работает даже по SSH
set -g display-time 1500
set -g status-interval 5
setw -g aggressive-resize on
set -gq allow-passthrough on              # картинки/escape-последовательности (3.3+)

# ── zsh ──
set -g default-shell "$SHELL"             # zsh, если он ваш login-шелл (chsh -s $(which zsh))

# ── kitty + Pi: расширенные клавиши (Shift+Enter, Alt+Enter и т.п.) ──
set -g extended-keys on
set -gq extended-keys-format csi-u        # tmux 3.5+; на 3.2–3.4 опция не существует — -q глушит ошибку
set -as terminal-features ",xterm-kitty:RGB:extkeys:clipboard:hyperlinks"
set -as terminal-features ",xterm-256color:RGB:extkeys:clipboard:hyperlinks"   # iTerm2 (macOS)

set -g mode-keys vi                       # vi-клавиши в copy-mode
set -g status-keys vi                     # vi-клавиши в командной строке tmux (prefix :)

# ───────────── Префикс ─────────────
unbind C-b
set -g prefix C-t
bind C-t send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux.conf перезагружен"

# ───────────── Панели (vim: h j k l) ─────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5                # Shift+hjkl — изменить размер (можно удерживать)
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Разделение: сохраняем текущую папку
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ───────────── Окна ─────────────
bind -r C-h select-window -t :-           # prefix Ctrl+h / Ctrl+l — предыдущее/следующее
bind -r C-l select-window -t :+
bind Tab last-window
bind C-l send-keys C-l                    # очистить экран (Ctrl+l занят навигатором)

# ───────────── Copy-mode (как в vim) ─────────────
# Войти: prefix [  или  prefix Esc  или просто покрутить колесо мыши
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
# y и выделение мышью копируют в системный буфер (плагин tmux-yank)
bind P paste-buffer

# ───────────── Всплывающие окна (tmux 3.2+) ─────────────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind b display-popup -E -w 90% -h 90% "btop"
# Быстрое переключение сессий через fzf
bind S display-popup -E -w 60% -h 50% "tmux list-sessions | cut -d: -f1 | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"

# ───────────── Внешний вид ─────────────
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bg=colour39 fg=colour16 bold] #S #[default] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[bg=colour208 fg=colour16 bold] PREFIX #[default] ,}#[fg=colour245]%d.%m %H:%M "
setw -g window-status-format " #I:#W#{?@workmux_status, #{@workmux_status},} "
setw -g window-status-current-format "#[bg=colour39 fg=colour16 bold] #I:#W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, Z,} #[default]"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g message-style "bg=colour39,fg=colour16"
set -g mode-style "bg=colour39,fg=colour16"

# ───────────── Плагины (TPM) ─────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl+h/j/k/l между панелями tmux и окнами vim
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix Ctrl+s сохранить, Ctrl+r восстановить
set -g @plugin 'tmux-plugins/tmux-continuum'      # автосохранение (держать последним)

set -g @yank_selection_mouse 'clipboard'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Привязки для агентов (создаются agent-lab.sh init; если файла нет — игнорируется)
source-file -q ~/.tmux.agents.conf

# Автоустановка TPM при первом запуске (нужен git)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
