# Добавьте в ~/.config/kitty/kitty.conf:   include kitty-tmux.conf
# (положите этот файл рядом с kitty.conf)

# ── Вариант Б автозапуска tmux (вместо блока в zshrc; включайте только один из двух) ──
# Каждое окно kitty сразу открывает/подключает сессию main.
# shell zsh -lc "tmux new-session -A -s main"

# ── Клавиши ──
# macOS: чтобы Alt+Enter, Alt+b/f работали в tmux, zsh и Pi
# macos_option_as_alt yes

# ── Буфер обмена: tmux копирует через OSC 52 ──
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# ── Удобства ──
enable_audio_bell no
confirm_os_window_close 0
scrollback_lines 10000
